<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#a51d2d">
    <title data-i18n="title-map">Map · UrgentDocs</title>
    <meta name="description" content="Find free and low-cost clinics and urgent care near you in New Hampshire, and see which ones fit your budget.">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <!-- What shows up when someone shares a link to the app. -->
    <meta property="og:title" content="Map · UrgentDocs">
    <meta property="og:description" content="Find free and low-cost clinics and urgent care near you in New Hampshire, and see which ones fit your budget.">
    <meta property="og:image" content="https://hamzalabib325-bit.github.io/NH-care-project/preview.png">
    <meta property="og:url" content="https://hamzalabib325-bit.github.io/NH-care-project/map.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="map-page">
    <header>
      <div class="emergency-banner" role="alert" aria-label="Emergency information" data-i18n-label="emergency-label">
        <p data-i18n="emergency">
          <strong>Medical emergency?</strong>
          Call <a href="tel:911">911</a> now for chest pain, trouble breathing,
          stroke symptoms, or another life-threatening emergency.
        </p>
      </div>
      <nav class="site-nav" aria-label="Main">
        <a href="index.html" data-i18n="nav-home">Home</a>
        <a href="map.html" aria-current="page" data-i18n="nav-map">Map</a>
        <a href="cost.html" data-i18n="nav-costs">Costs</a>
        <a href="help.html" data-i18n="nav-help">More help</a>
        <a href="about.html" data-i18n="nav-about">About</a>
      </nav>
    </header>

    <main class="map-panel">
      <h1 class="visually-hidden" data-i18n="map-heading">Map of clinics in New Hampshire</h1>

      <div class="map-tools">
        <!-- The search runs only in this browser; what you type is never sent anywhere. -->
        <form class="place-search" id="place-search" role="search">
          <label for="place-input" data-i18n="search-label">Search by NH ZIP code or town</label>
          <div class="place-search-row">
            <input type="text" id="place-input" list="town-list" autocomplete="off"
                   placeholder="e.g. 03301 or Concord" data-i18n-placeholder="place-placeholder" aria-describedby="place-status">
            <button type="submit" data-i18n="search-button">Search</button>
          </div>
          <datalist id="town-list"></datalist>
          <p class="place-status" id="place-status" role="status"></p>
        </form>

        <!-- Each button is both a color key and an on/off switch for that kind of clinic. -->
        <fieldset class="filters">
          <legend class="visually-hidden" data-i18n="filter-legend">Show on map</legend>
          <label class="filter-chip">
            <input type="checkbox" name="filter" value="free_clinic" checked>
            <span class="dot dot-free" aria-hidden="true"></span><span data-i18n="filter-free">Free clinics</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="filter" value="health_center" checked>
            <span class="dot dot-health" aria-hidden="true"></span><span data-i18n="filter-health">Health centers</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="filter" value="urgent_care" checked>
            <span class="dot dot-urgent" aria-hidden="true"></span><span data-i18n="filter-urgent">Urgent care</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="filter" value="membership" checked>
            <span class="dot dot-membership" aria-hidden="true"></span><span data-i18n="filter-membership">Membership clinics</span>
          </label>
        </fieldset>
      </div>

      <div class="map-wrap">
        <div id="map" role="region" aria-label="Map of New Hampshire"></div>
        <p class="map-message" id="map-message" role="status" hidden></p>
      </div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Groups nearby pins into numbered bubbles: github.com/Leaflet/Leaflet.markercluster -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="translations.js"></script>
    <script src="lang.js"></script>
    <script src="common.js"></script>
    <script src="map.js"></script>
  </body>
</html>
